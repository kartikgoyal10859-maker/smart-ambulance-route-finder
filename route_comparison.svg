<svg xmlns='http://www.w3.org/2000/svg' width='800' height='420'><rect width='100%' height='100%' fill='#fff'/><text x='400' y='35' text-anchor='middle' font-size='22' font-family='Arial' font-weight='bold'>Route Distance Comparison</text><text x='30' y='88' font-size='14' font-family='Arial'>Shortest route</text><rect x='30' y='100' width='32' height='30' fill='#218838'/><text x='72' y='120' font-size='13' font-family='Arial'>4 km</text><text x='30' y='178' font-size='14' font-family='Arial'>Alternative route 1</text><rect x='30' y='190' width='88' height='30' fill='#e6a23c'/><text x='128' y='210' font-size='13' font-family='Arial'>11 km</text><text x='30' y='268' font-size='14' font-family='Arial'>Alternative route 2</text><rect x='30' y='280' width='0' height='30' fill='#e6a23c'/><text x='40' y='300' font-size='13' font-family='Arial'>No alternative found</text><text x='30' y='390' font-size='12' font-family='Arial'>Alternatives are calculated by blocking roads on the shortest route. Distances are simulated.</text></svg>